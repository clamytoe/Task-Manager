[project]
name = "task-manager"
version = "0.3.0"
description = "A Flask-based task manager with SQLAlchemy and PySpark integration."
authors = [{ name = "Martin Uribe" }]
requires-python = ">=3.13"

dependencies = [
    "click==8.2.1",
    "flasgger==0.9.7.1",
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "jinja2==3.1.6",
    "markupsafe==3.0.2",
    "pyspark==3.4.4",
    "sqlalchemy==2.0.41",
    "gunicorn==22.0.0"
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==6.2.1",
    "black",
    "isort",
    "mypy"
]

[tool.pytest.ini_options]
addopts = "--cov=task_manager --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["task_manager"]

[tool.coverage.report]
show_missing = true

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
